<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A themeable demo storefront built on Devduo ESaas." />
    <title>Devduo ESaas storefront demo</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%8D%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <script>
      // Apply the last used theme before first paint, so there is no flash of the default look.
      (function () {
        try {
          var raw = localStorage.getItem('devduo.themevars');
          if (!raw) return;
          var saved = JSON.parse(raw);
          var root = document.documentElement;
          for (var k in saved.vars) root.style.setProperty(k, saved.vars[k]);
          root.setAttribute('data-theme', saved.mode);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
